
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Student</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            padding: 30px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            background: #198754;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            cursor: pointer;
        }

        .flash {
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        .error {
            background: #f8d7da;
            color: #842029;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Edit Student</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash {{ category }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endwith %}

    <form action="{{ url_for('update_student', id=student.id) }}"
          method="POST">

        <input type="text"
               name="name"
               value="{{ student.name }}"
               required
               minlength="2">

        <input type="number"
               name="age"
               value="{{ student.age }}"
               min="1"
               max="120"
               required>

        <input type="text"
               name="subject"
               value="{{ student.subject }}"
               required
               minlength="2">

        <button type="submit">Update Student</button>

    </form>

    <p>
        <a href="{{ url_for('home') }}">Back to Dashboard</a>
    </p>

</div>

</body>
</html>
